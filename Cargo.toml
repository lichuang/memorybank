[workspace]
members = ["crates/memorybank", "crates/engine", "crates/store", "crates/llm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
engine = { path = "crates/engine" }
store = { path = "crates/store" }
llm = { path = "crates/llm" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
