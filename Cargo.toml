[workspace]
members = ["crates/memorybank", "crates/engine", "crates/store", "crates/llm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
engine = { path = "crates/engine" }
store = { path = "crates/store" }
llm = { path = "crates/llm" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive", "chrono04"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"
tracing = "0.1"
sqlite-vec = "0.1"
libsqlite3-sys = "0.37"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[workspace.lints.rust]
# `deny` (not `forbid`) so the single SQLite-extension registration site can
# opt in with a SAFETY comment; everything else remains unsafe-free.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
